<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Hệ thống quản lý tài sản và kho thiết bị — Công ty CP Công nghệ Giáo dục Learn to Leap"
    />
    <title>AssetOps — Quản lý Tài sản Learn to Leap</title>

    <!--
      Biểu tượng: SVG là bản chính (nét ở mọi cỡ, chỉ 1,1KB); PNG 32px để
      những chỗ chưa đọc được SVG vẫn có cái hiển thị. favicon.svg là bản GIẢN
      LƯỢC — bỏ tai và khối tài sản, vì ở 16-32px các chi tiết đó thành nhiễu.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1B5AEA" />

    <!--
      Thẻ xem trước khi dán link vào Zalo / Messenger / Slack. og:image PHẢI là
      URL tuyệt đối — bộ quét của các nền tảng này không phân giải đường dẫn
      tương đối, để tương đối là link ra trắng trơn không có ảnh.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AssetOps — Learn to Leap" />
    <meta property="og:title" content="AssetOps — Quản lý Tài sản &amp; Kho thiết bị" />
    <meta
      property="og:description"
      content="Hệ thống quản lý tài sản, kho thiết bị và robot STEM của Learn to Leap."
    />
    <meta property="og:url" content="https://assetops.learntoleap.vn/" />
    <meta property="og:image" content="https://assetops.learntoleap.vn/og-assetops.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="vi_VN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AssetOps — Quản lý Tài sản &amp; Kho thiết bị" />
    <meta name="twitter:image" content="https://assetops.learntoleap.vn/og-assetops.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="goc"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
