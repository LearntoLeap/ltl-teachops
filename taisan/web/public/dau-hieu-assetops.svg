<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AssetOps">
  <title>AssetOps — Learn to Leap</title>
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B5AEA"/>
      <stop offset="1" stop-color="#1246CC"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#nen)"/>

  <!-- ăng-ten -->
  <circle cx="256" cy="58" r="23" fill="#6BB8FF"/>
  <rect x="248" y="76" width="16" height="58" rx="8" fill="#fff"/>

  <!-- tai -->
  <rect x="74" y="212" width="38" height="92" rx="19" fill="#CBDDFB"/>
  <rect x="400" y="212" width="38" height="92" rx="19" fill="#CBDDFB"/>

  <!-- đầu -->
  <rect x="110" y="128" width="292" height="244" rx="54" fill="#fff"/>

  <!-- kính -->
  <rect x="154" y="170" width="204" height="116" rx="56" fill="#12285C"/>
  <!-- mắt ^^ -->
  <g fill="none" stroke="#6BB8FF" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
