<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AssetOps">
  <title>AssetOps</title>
  <!--
    Bản GIẢN LƯỢC dùng riêng cho favicon. Bản đủ (dau-hieu-assetops.svg) có
    thêm tai và khối tài sản; ở 16-32px những chi tiết đó biến thành nhiễu và
    làm mặt robot bé lại tới mức không đọc được. Ở đây bỏ tai, bỏ khối, cho đầu
    chiếm gần hết khung và mắt dày hơn — đã đối chiếu bằng ảnh render ở 4 cỡ.
  -->
  <rect width="512" height="512" rx="104" fill="#1B5AEA"/>
  <circle cx="256" cy="74" r="26" fill="#6BB8FF"/>
  <rect x="88" y="124" width="336" height="288" rx="66" fill="#fff"/>
  <rect x="136" y="178" width="240" height="138" rx="66" fill="#12285C"/>
  <g fill="none" stroke="#6BB8FF" stroke-width="27" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170 264 L204 224 L238 264"/>
    <path d="M274 264 L308 224 L342 264"/>
  </g>
  <path d="M200 350 Q256 392 312 350" fill="none" stroke="#1B5AEA"
        stroke-width="26" stroke-linecap="round"/>
