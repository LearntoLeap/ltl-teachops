# Dán vào Configuration File của tên miền API trong aaPanel,
# BÊN TRONG khối server { ... } đã có sẵn.
#
# Ba dòng Upgrade/Connection/proxy_http_version là BẮT BUỘC: thiếu chúng thì
# Socket.IO không nối được và các màn hình realtime sẽ im lặng không cập nhật.

location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ảnh tối đa 10MB/tệp, để dư cho nhiều ảnh trong một lần gửi
    client_max_body_size 60m;

    # Socket.IO giữ kết nối lâu — đừng để nginx tự cắt
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;
}
