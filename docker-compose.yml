# =============================================================================
# LtL TeachOps — hạ tầng VPS (chạy tốt trong 4GB RAM)
#   api    : Fastify — REST + tải tệp + SSE
#   db     : PostgreSQL 16
#   caddy  : TLS tự động (Let's Encrypt) + reverse proxy — TUỲ CHỌN, xem dưới
#
# api luôn công bố cổng 3000 CHỈ trên 127.0.0.1 (không lộ ra Internet) — dùng
# để một reverse proxy chạy trên HOST (Nginx của aaPanel/bt-panel, hoặc Caddy
# bên dưới) trỏ vào.
#
# Hai cách chạy:
#   1) VPS đã có panel quản trị (aaPanel...) với Nginx + xin SSL sẵn:
#        docker compose up -d          # chỉ chạy db + api
#      rồi tạo site "Proxy Project" trong panel trỏ về http://127.0.0.1:3000
#   2) VPS trần, chưa có panel nào — dùng Caddy đi kèm để tự lo TLS:
#        docker compose --profile caddy up -d
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Đối chiếu tiếng Việt cho sắp xếp tên
      LANG: C.UTF-8
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
      # Các file .sql ở đây chỉ chạy khi pgdata TRỐNG (lần khởi động đầu tiên)
      - ./server/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M
    # Không mở cổng ra ngoài — chỉ api trong mạng nội bộ truy cập được.
    expose:
      - "5432"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-100}
      MAX_MATERIAL_MB: ${MAX_MATERIAL_MB:-300}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      # Google Drive — thường kết nối ngay trong app (Lưu trữ Drive); các biến dưới là dự phòng
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      DRIVE_SYNC_MINUTES: ${DRIVE_SYNC_MINUTES:-5}
      DRIVE_KEEP_LOCAL_DAYS: ${DRIVE_KEEP_LOCAL_DAYS:-7}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./data/uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 640M
    # 127.0.0.1 = chỉ tiến trình khác TRÊN CHÍNH VPS này gọi được (Nginx của
    # panel, hoặc Caddy ở dưới) — Internet không truy cập trực tiếp cổng này.
    # API_HOST_PORT đổi được trong .env khi VPS đã có dịch vụ khác chiếm cổng
    # (kiểm tra trước bằng: ss -tlnp | grep :3000).
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"

  # Chỉ khởi động khi chạy: docker compose --profile caddy up -d
  # (bỏ qua hoàn toàn nếu VPS đã có panel tự lo Nginx + SSL, ví dụ aaPanel)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["caddy"]
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    deploy:
      resources:
        limits:
          memory: 256M
